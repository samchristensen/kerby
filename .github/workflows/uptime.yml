# External synthetic check (plan 0003, D3): every 15 minutes, from outside Railway, ask the public api for /healthz, then
# read a conversation as the `canary` tenant: key check, tenant pool and tenant database in one request. The canary
# tenant holds one empty conversation and a placeholder model key (the api refuses a conversation without one); it never
# posts a message. Its key is the repository secret KERBY_CANARY_KEY, the conversation the variable
# KERBY_CANARY_CONVERSATION_ID (docs/deploy.md#releasing).
# A failure fails this workflow (GitHub emails whoever last changed this file) and posts to ALERT_WEBHOOK_URL when set.
# The address is the repository variable KERBY_API_URL. GitHub runs schedules late under load: this is a smoke alarm,
# not a pager.
name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  healthz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.KERBY_API_URL }}
      CANARY_KEY: ${{ secrets.KERBY_CANARY_KEY }}
      CANARY_CONVERSATION_ID: ${{ vars.KERBY_CANARY_CONVERSATION_ID }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: GET /healthz
        id: healthz
        run: |
          test -n "$API_URL" || { echo "::error::repository variable KERBY_API_URL is not set"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --max-time 20 "$API_URL/healthz"
      - name: GET a conversation as the canary tenant
        id: canary
        run: |
          test -n "$CANARY_KEY" || { echo "::error::repository secret KERBY_CANARY_KEY is not set"; exit 1; }
          test -n "$CANARY_CONVERSATION_ID" || { echo "::error::repository variable KERBY_CANARY_CONVERSATION_ID is not set"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --max-time 20 \
            --output /dev/null -H "authorization: Bearer $CANARY_KEY" "$API_URL/v1/conversations/$CANARY_CONVERSATION_ID"
      - if: failure() && env.ALERT_WEBHOOK_URL != ''
        name: Alert
        run: |
          failed="GET /healthz"
          if [ "${{ steps.healthz.outcome }}" = success ]; then failed="the canary tenant's authenticated read"; fi
          message="kerby uptime: $failed failed at $API_URL (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          # `text` is what Slack reads, `content` what Discord reads; each ignores the other.
          jq -n --arg m "$message" '{text: $m, content: $m}' |
            curl --fail --silent --show-error --max-time 20 -H 'content-type: application/json' --data @- "$ALERT_WEBHOOK_URL"
