# The gate (plan 0001 M0, ADR 0011): every pull request and every push to main runs `make check` and `make test` and
# builds the service images. A pull request also previews the Railway IaC change. A push to main publishes the images
# to GHCR as `sha-<commit>`, applies `.railway/railway.ts` to production, creates any new secret and public domain, and
# rolls the images out (control, then the rest). Railway builds nothing. Actions are pinned by commit SHA (versions live
# once).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RAILWAY_CLI_VERSION: 5.62.1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: make setup
      - run: make check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: make setup
      # Tests start their own Postgres and RustFS containers (scripts/test-containers.ts); the runner has Docker.
      - run: make test

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [control, api, worker, dispatcher, console]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          target: prod
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kerby-${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kerby-${{ matrix.service }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # What the IaC file would change in production, shown on the pull request's checks. Needs RAILWAY_TOKEN.
  railway-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - if: env.RAILWAY_TOKEN == ''
        run: echo "::warning::RAILWAY_TOKEN is not set; no Railway plan. See docs/deploy.md (Releasing)."
      # Every setup step is conditional: setup-node's pnpm cache post-step fails when nothing was installed.
      - if: env.RAILWAY_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RAILWAY_TOKEN != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: env.RAILWAY_TOKEN != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: env.RAILWAY_TOKEN != ''
        run: |
          make setup
          npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"
          railway config plan

  # Apply the IaC file, then roll this commit's images out to production. One release at a time, never cancelled.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: release-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - if: env.RAILWAY_TOKEN == '' || env.GHCR_PULL_TOKEN == ''
        run: echo "::warning::RAILWAY_TOKEN or GHCR_PULL_TOKEN is not set; images are published but not deployed. See docs/deploy.md (CI)."
      - if: env.RAILWAY_TOKEN != '' && env.GHCR_PULL_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RAILWAY_TOKEN != '' && env.GHCR_PULL_TOKEN != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: env.RAILWAY_TOKEN != '' && env.GHCR_PULL_TOKEN != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: env.RAILWAY_TOKEN != '' && env.GHCR_PULL_TOKEN != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.RAILWAY_TOKEN != '' && env.GHCR_PULL_TOKEN != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.RAILWAY_TOKEN != '' && env.GHCR_PULL_TOKEN != ''
        name: Release to production
        run: |
          make setup
          npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"
          # Additions and changes only: a deletion fails here and needs a person (docs/deploy.md).
          railway config apply --yes
          # A secret or public service the IaC file just added: created once, never replaced.
          node scripts/railway.ts secrets production
          node scripts/railway.ts domains production
          node scripts/railway.ts registry production
          node scripts/railway.ts deploy production "sha-${GITHUB_SHA}"
