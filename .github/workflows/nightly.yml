# The real-stack proofs, nightly and on demand: `make e2e` (kill a worker mid-turn) and `make multitenant` (cross-tenant
# attempts, suspension, a load run) against the Compose stack built from this commit.
name: nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: make setup
      - run: make e2e
      - run: make multitenant
      - if: always()
        run: make down-v
