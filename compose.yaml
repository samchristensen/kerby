# The whole stack on one machine: the same images as a hosted deployment, started with `make up`.
# Local values only: the tokens and secrets below are for development and must never be used elsewhere.
name: ${KERBY_PROJECT:-kerby-stack}

# Kerby's own processes need no Linux capability and never gain privilege.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-tenant-env: &tenant-env
  CONTROL_DATABASE_URL: postgres://postgres:dev@postgres:5432/kerby_control
  # Seals each tenant database role's random password in the control database (ADR 0009). A development key.
  TENANT_DB_KEYS: ${KERBY_TENANT_DB_KEYS:-Ga5JSSydS48D60HoBOzAmEPJeUKLm3s44q+oguVov0M=}
  S3_ENDPOINT: http://rustfs:9000
  S3_BUCKET: kerby
  S3_ACCESS_KEY_ID: devkey
  S3_SECRET_ACCESS_KEY: devsecret123
  # Where alerts are posted (docs/deploy.md#alerts); empty, alerts are log lines only. A listener on this machine is
  # http://host.docker.internal:<port>/.
  ALERT_WEBHOOK_URL: ${KERBY_ALERT_WEBHOOK_URL:-}

services:
  postgres:
    image: postgres:18-alpine
    # The same limit as hosted Postgres (docs/deploy.md#postgres), so `make multitenant` measures against it.
    command: ["-c", "max_connections=500"]
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: kerby_control
    volumes:
      # Postgres 18 images keep a versioned data directory below /var/lib/postgresql, so that is the volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kerby_control"]
      interval: 3s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.6
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: devkey
      RUSTFS_SECRET_KEY: devsecret123
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/"]
      interval: 3s
      timeout: 3s
      retries: 20

  control:
    <<: *hardened
    build:
      context: .
      dockerfile: services/control/Dockerfile
      target: ${KERBY_IMAGE_TARGET:-prod}
    environment:
      <<: *tenant-env
      OPERATOR_TOKEN: ${KERBY_OPERATOR_TOKEN:-local-dev-operator-token-0123456789}
      # Opens self-serve sign-up (POST /v1/console/signups) and nothing else; the console holds the same value.
      CONSOLE_TOKEN: ${KERBY_CONSOLE_TOKEN:-local-dev-console-token-0123456789}
      CLUSTER_ADMIN_URL: postgres://postgres:dev@postgres:5432/postgres
      CLUSTER_HOST: postgres
      CLUSTER_PORT: "5432"
      PORT: "8081"
      # Exports and the backup copy are buckets of their own, created by control at start. In production each has its
      # own keys, which only control holds; locally they share RustFS's.
      EXPORT_S3_ENDPOINT: http://rustfs:9000
      EXPORT_S3_BUCKET: kerby-exports
      EXPORT_S3_ACCESS_KEY_ID: devkey
      EXPORT_S3_SECRET_ACCESS_KEY: devsecret123
      BACKUP_S3_ENDPOINT: http://rustfs:9000
      BACKUP_S3_BUCKET: kerby-backup
      BACKUP_S3_ACCESS_KEY_ID: devkey
      BACKUP_S3_SECRET_ACCESS_KEY: devsecret123
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_healthy }

  api:
    <<: *hardened
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: ${KERBY_IMAGE_TARGET:-prod}
    environment:
      <<: *tenant-env
      # The default model for a conversation that names none. Tenants bring their own key per provider
      # (PUT /v1/model-keys/<provider>); `fake` needs none and only exists with KERBY_FAKE_MODEL=1 on the worker.
      DEFAULT_MODEL: ${KERBY_DEFAULT_MODEL:-fake/fake-1}
      KEYLESS_PROVIDERS: ${KERBY_KEYLESS_PROVIDERS:-fake}
      # `kerby/echo` may be named by conversations (development); the worker below offers it likewise.
      ENABLE_ECHO_TOOL: "1"
      # A development key pair (the private half is on the worker below): never use it anywhere real.
      SECRETS_PUBLIC_KEY: "y4c7+AJM8aN76nrweWjLR0gShtooDI7uI0ay8mTDHR0="
      # Short, so suspension and key revocation show within seconds locally (the default is 30).
      AUTH_CACHE_SECONDS: "3"
      # Clients reach the api directly here, so X-Forwarded-For is not trusted (TRUST_PROXY is on only on Railway).
      TRUST_PROXY: "false"
      PORT: "8080"
      # Kerby's OAuth redirect URI and Client ID Metadata Document live on the console (ADR 0019); the console below has
      # the same address as PUBLIC_URL. Plain http here, so authorization servers get a dynamically registered client.
      CONSOLE_PUBLIC_URL: http://127.0.0.1:${KERBY_CONSOLE_PORT:-3000}
      # Development only (ADR 0019), like the worker's: OAuth discovery and the code exchange may reach a test MCP server
      # and its authorization server on this machine, over plain http. Every other tenant URL must still be public.
      KERBY_ENVIRONMENT: development
      EGRESS_ALLOWED_HOSTS: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # The only published port: the tenant-facing API, on loopback. There is no shared proxy locally.
      - "127.0.0.1:${KERBY_API_PORT:-8080}:8080"
    depends_on:
      control: { condition: service_healthy }

  worker:
    <<: *hardened
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      target: ${KERBY_IMAGE_TARGET:-prod}
    environment:
      <<: *tenant-env
      # Development only: the scripted model answers, and the built-in echo tool exists. Production refuses both.
      KERBY_ENVIRONMENT: development
      KERBY_FAKE_MODEL: ${KERBY_FAKE_MODEL:-1}
      ENABLE_ECHO_TOOL: "1"
      SWEEP_INTERVAL_SECONDS: "3"
      # Short, so a killed worker's turn moves to another worker in seconds (the default is two minutes).
      CLAIM_TIMEOUT_SECONDS: "10"
      SECRETS_PRIVATE_KEYS: "oLJooOTi5uJQL4lbxdJoXNIFChaniiOI87/7rlz341o="
      # Judgments (ADR 0015) call TypeSafe and OpenCode with the tenant's own key; point these at stand-ins to exercise them offline.
      TYPESAFE_BASE_URL: ${KERBY_TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      OPENCODE_SYSTEMONE_BASE_URL: ${KERBY_OPENCODE_SYSTEMONE_BASE_URL:-https://opencode.ai/inference/systemone}
      # Development only (ADR 0019): the egress guard lets this host through although it is private, so a test MCP server
      # on this machine can answer (`make tools-e2e`). Every other tenant URL must still be public.
      EGRESS_ALLOWED_HOSTS: host.docker.internal
    extra_hosts:
      # Docker Desktop resolves it by itself; Linux needs the gateway named.
      - "host.docker.internal:host-gateway"
    depends_on:
      control: { condition: service_healthy }

  # The tenant console (ADR 0014): sign-up, sign-in, API keys and model keys. Locally it connects to the control database
  # as the admin, like api and worker; hosted it is the limited `kerby_console` role.
  console:
    <<: *hardened
    build:
      context: .
      dockerfile: services/console/Dockerfile
      target: ${KERBY_IMAGE_TARGET:-prod}
    environment:
      CONTROL_DATABASE_URL: postgres://postgres:dev@postgres:5432/kerby_control
      CONTROL_URL: http://control:8081
      CONSOLE_TOKEN: ${KERBY_CONSOLE_TOKEN:-local-dev-console-token-0123456789}
      # The api's development public key (above): model keys stored here are sealed to it.
      SECRETS_PUBLIC_KEY: "y4c7+AJM8aN76nrweWjLR0gShtooDI7uI0ay8mTDHR0="
      # Chat goes through the api, over the private network; the quickstart shows the published address.
      API_URL: http://api:8080
      API_PUBLIC_URL: http://127.0.0.1:${KERBY_API_PORT:-8080}
      # Its own published address: Kerby's OAuth Client ID Metadata Document is served under it, and the api's
      # CONSOLE_PUBLIC_URL is the same value.
      PUBLIC_URL: http://127.0.0.1:${KERBY_CONSOLE_PORT:-3000}
      # Served over plain HTTP here, so the session cookie cannot be Secure; hosted it is.
      SECURE_COOKIES: "false"
      TRUST_PROXY: "false"
      PORT: "3000"
    ports:
      - "127.0.0.1:${KERBY_CONSOLE_PORT:-3000}:3000"
    depends_on:
      control: { condition: service_healthy }
      api: { condition: service_healthy }

volumes:
  pgdata:
  rustfsdata:
