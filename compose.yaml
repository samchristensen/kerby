# A whole install on one machine (ADR 0024): Postgres, RustFS, the `kerby` container (control, api, worker and
# dispatcher) and the console, started with `make up`. Local values only: the secrets below are for development and
# must never be used elsewhere; `make secrets-key` makes real ones. docs/deploy.md has the same stack for another
# project, from the published images.
name: ${KERBY_PROJECT:-kerby-stack}

# Kerby's own processes need no Linux capability and never gain privilege.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# What both Kerby containers need: the one secret every key derives from, and Kerby's own Postgres as its superuser.
x-install: &install
  KERBY_SECRET_KEY: ${KERBY_SECRET_KEY:-s2Sou9gACEONnF3MysTkMMsCswtx8uft+/jI9VhsgCE=}
  DATABASE_URL: postgres://postgres:dev@postgres:5432/kerby_control

# Everything the kerby containers read besides the install: their settings for this development stack.
x-kerby-env: &kerby-env
  <<: *install
  # Control keeps the install's one tenant, this key (every scope) and this console account at every start.
  KERBY_API_KEY: ${KERBY_API_KEY:-kb_bf2ae0b02ed6_clrzu-oCqKlUr7NoXI9DWzK5gLqRDyU7uqfv4TENU3w}
  KERBY_ADMIN_EMAIL: ${KERBY_ADMIN_EMAIL:-admin@example.com}
  KERBY_ADMIN_PASSWORD: ${KERBY_ADMIN_PASSWORD:-local-dev-password}
  S3_ENDPOINT: http://rustfs:9000
  S3_BUCKET: kerby
  S3_ACCESS_KEY_ID: devkey
  S3_SECRET_ACCESS_KEY: devsecret123
  # Where alerts are posted (docs/deploy.md#alerts); empty, alerts are log lines only. A listener on this machine
  # is http://host.docker.internal:<port>/.
  ALERT_WEBHOOK_URL: ${KERBY_ALERT_WEBHOOK_URL:-}
  # Development only: the scripted model answers (a real one: see ARCHITECTURE.md#local-stack). Production refuses it.
  KERBY_ENVIRONMENT: development
  KERBY_FAKE_MODEL: ${KERBY_FAKE_MODEL:-1}
  DEFAULT_MODEL: ${KERBY_DEFAULT_MODEL:-fake/fake-1}
  KEYLESS_PROVIDERS: ${KERBY_KEYLESS_PROVIDERS:-fake}
  # Conversations may name the built-in `kerby/echo` tool.
  ENABLE_ECHO_TOOL: "1"
  # Judgments (ADR 0015) call TypeSafe and OpenCode with the tenant's own key; point these at stand-ins to exercise them offline.
  TYPESAFE_BASE_URL: ${KERBY_TYPESAFE_BASE_URL:-https://api.typesafe.ai}
  OPENCODE_SYSTEMONE_BASE_URL: ${KERBY_OPENCODE_SYSTEMONE_BASE_URL:-https://opencode.ai/inference/systemone}
  # Short, so revocation shows within seconds and a killed worker's turn moves in seconds (defaults 30 s and 2 min).
  AUTH_CACHE_SECONDS: "3"
  SWEEP_INTERVAL_SECONDS: "3"
  CLAIM_TIMEOUT_SECONDS: "10"
  # Clients reach the api directly here, so X-Forwarded-For is not trusted (TRUST_PROXY is on behind Railway's edge).
  TRUST_PROXY: "false"
  # Kerby's OAuth redirect URI and Client ID Metadata Document live on the console (ADR 0022), at its PUBLIC_URL.
  # Plain http here, so authorization servers get a dynamically registered client.
  CONSOLE_PUBLIC_URL: http://127.0.0.1:${KERBY_CONSOLE_PORT:-3000}
  # The install's own services, which the egress guard would otherwise refuse (ADR 0010, amended by 0024): an MCP
  # server or webhook receiver on this machine, and 127.0.0.1, where the browser opens a test server's authorize
  # endpoint (`startOAuthFixture({ urlHost: "host.docker.internal", browserHost: "127.0.0.1" })`). Webhooks may be
  # plain http and private.
  EGRESS_ALLOWED_HOSTS: host.docker.internal,127.0.0.1
  ALLOW_LOCAL_DESTINATIONS: "true"

services:
  postgres:
    # Postgres 18 with pgvector (ADR 0021), as on Railway, whose `postgres-ssl:18` ships the extension too.
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: kerby_control
    volumes:
      # Postgres 18 images keep a versioned data directory below /var/lib/postgresql, so that is the volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kerby_control"]
      interval: 3s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.6
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: devkey
      RUSTFS_SECRET_KEY: devsecret123
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Control, api, worker and dispatcher in one container, started by the launcher (services/kerby). `make e2e` runs it
  # without the worker (KERBY_ROLES) and adds two `worker` containers, so it can kill one mid-turn.
  kerby:
    <<: *hardened
    build: &kerby-build
      context: .
      dockerfile: services/kerby/Dockerfile
      target: ${KERBY_IMAGE_TARGET:-prod}
    environment:
      <<: *kerby-env
      KERBY_ROLES: ${KERBY_ROLES:-control,api,worker,dispatcher}
    extra_hosts: &host-gateway # Docker Desktop resolves it by itself; Linux needs the gateway named.
      - "host.docker.internal:host-gateway"
    ports:
      # The api, on loopback. Control, worker and dispatcher answer only inside the container.
      - "127.0.0.1:${KERBY_API_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_healthy }

  # More workers: the same image running only the worker (profile `workers`, `docker compose --profile workers up
  # --scale worker=2`). Any worker takes any turn.
  worker:
    <<: *hardened
    profiles: [workers]
    build: *kerby-build
    environment:
      <<: *kerby-env
      KERBY_ROLES: worker
    extra_hosts: *host-gateway
    depends_on:
      kerby: { condition: service_healthy }

  # The console (ADR 0014): sign in as KERBY_ADMIN_EMAIL; integrations and keys, model keys, tools, prompts and chat.
  console:
    <<: *hardened
    build:
      context: .
      dockerfile: services/console/Dockerfile
      target: ${KERBY_IMAGE_TARGET:-prod}
    environment:
      <<: *install
      # Chat goes through the api, inside the network; the quickstart shows the published address.
      API_URL: http://kerby:8080
      API_PUBLIC_URL: http://127.0.0.1:${KERBY_API_PORT:-8080}
      # Its own published address: Kerby's OAuth Client ID Metadata Document is served under it, and the api's
      # CONSOLE_PUBLIC_URL is the same value.
      PUBLIC_URL: http://127.0.0.1:${KERBY_CONSOLE_PORT:-3000}
      # Served over plain HTTP here, so the session cookie cannot be Secure; behind TLS it is.
      SECURE_COOKIES: "false"
      TRUST_PROXY: "false"
      PORT: "3000"
    ports:
      - "127.0.0.1:${KERBY_CONSOLE_PORT:-3000}:3000"
    depends_on:
      kerby: { condition: service_healthy }

volumes:
  pgdata:
  rustfsdata:
