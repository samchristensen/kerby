packages:
  - packages/*
  - services/*

# One hoisted node_modules; exact pins; pnpm refuses versions published in the last 7 days (minutes).
nodeLinker: hoisted
savePrefix: ""
minimumReleaseAge: 10080

# Every external dependency version lives here, once. Workspaces say "catalog:".
catalog:
  "@earendil-works/chord": "1.4.0"
  "@earendil-works/pi-ai": "1.4.0"
  "@earendil-works/pi-durable": "1.4.0"
  "@aws-sdk/client-s3": "3.1169.0"
  "@aws-sdk/s3-request-presigner": "3.1169.0"
  "absurd-sdk": "0.5.1"
  "railway": "3.17.0"
  "@biomejs/biome": "2.6.4"
  "@types/node": "26.6.6"
  "@types/pg": "8.23.1"
  "knip": "6.45.1"
  "typescript": "7.0.2"
  "vitest": "5.1.0"
  "yaml": "2.9.1"
  "zod": "4.6.7"
  "pg": "8.23.1"
